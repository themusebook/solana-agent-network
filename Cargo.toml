[package]
name = "solana-agent-network"
version = "0.1.0"
edition = "2021"
description = "Solana Agent Network (devnet): join, network cards, peer discovery, x402m messaging, MCP server and CLI. Adapted from Reason Network."
license = "MIT OR Apache-2.0"
repository = "https://github.com/themusebook/solana-agent-network"
readme = "README.md"

[[bin]]
name = "san"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bs58 = "0.5"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
tiny_http = "0.12"
